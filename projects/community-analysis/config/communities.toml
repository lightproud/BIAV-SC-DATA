# 社区圈与区服映射（T10）。规则自上而下，取第一个命中的。
# platform 必填；region 选填，对的是数据湖路径的第二段（如 discord/global/... 的 global）。
# community 必填；server 只在路径本身写明区服时填，查不到就不写（规范化时留空，不猜）。
# 都不命中的平台 community 记 "unknown"。

[[rule]]
platform = "discord"
region = "global"
community = "global"
server = "global"

[[rule]]
platform = "discord"
region = "jp"
community = "jp"
server = "jp"

[[rule]]
platform = "discord"
region = "volunteer"
community = "volunteer"   # 志愿者服务器，单列；归哪个圈待守密人定

