# 参数与阈值。环境变量 YUQING_<段>_<键> 可覆盖（如 YUQING_UNITIZE_GAP_MINUTES=15）。
# 标「占位值」的须在金标集上校准。

[unitize]
gap_minutes = 2         # 相邻两句超过这个间隔就切段；G0（2026-10-03）由 10 改 2：大频道间隔 P90 26 秒、P99 550 秒；单元只是阅读窗口，G1 再验
max_msgs = 30           # 一段正文的条数上限
overlap_msgs = 5        # 每段开头附上前一段最后几句作只读上下文
seal_minutes = 30       # 静默多久才封口送标

[clean]
# Q9（2026-10-03）：多标签 msg_flags + 三档路由；阈值 G1 试切时校准
same_author_window_hours = 24   # 同作者完全重复、近似重复的判定窗口
long_repost_min_chars = 60      # 多长的相同文字算原样转贴
short_max_chars = 2             # 极短内容：去掉空白与自定义表情后不超过几个字（只对聊天）
long_post_min_chars = 500       # 长贴：只标不拦
burst_window_s = 60             # 连发：同一人在这么多秒内……
burst_min_msgs = 5              # ……发了至少这么多条（只作属性不拦）
chorus_window_s = 120           # 接龙：这么多秒内……
chorus_min_authors = 3          # ……至少这么多人发同一短句（短句即不到 long_repost_min_chars 字）

[llm]
protocol = "openai"     # openai（OpenAI 兼容 chat completions）或 anthropic（Messages）
timeout_s = 60.0        # 单次请求超时（秒）
max_retries = 4         # 429、5xx、超时的重试次数（不含首发）
backoff_base_s = 1.0    # 指数退避起点（秒），带抖动
backoff_max_s = 30.0    # 退避封顶（秒）
max_concurrency = 4     # 并发上限
rpm = 60                # 每分钟请求上限；0 不限
max_tokens = 4096       # 单次输出上限
log_bodies = false      # 台账默认不记正文，只记输入哈希

[annotate]
units_per_call = 20     # 每次调用装几个单元；金标集上比较 1、10、20
low_conf = 0.6          # 低于它就交中档模型复核；占位值

[issues]
tau_hi = 0.80           # 直归门槛；占位值
tau_lo = 0.60           # 进未归属池门槛；占位值
min_points = 20         # 成为候选议题的规模门槛
min_authors = 10

[lifecycle]
emerging_hours = 72     # 萌芽期时长
cooling_ratio = 0.2     # 低于峰值的这个比例算消退
dormant_days = 30       # 多久没有新反馈点算沉寂

[privacy]
min_authors_cell = 5    # 小样本保护的人数下限

[budget]
tokens_per_run = 0      # 0 表示未设置；未设置时拒绝调用真模型
tokens_per_day = 0
