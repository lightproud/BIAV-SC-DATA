[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuqing"
version = "0.0.1"
description = "玩家舆情分析系统（银芯 projects/community-analysis）"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
yuqing = "yuqing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yuqing = ["report/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["t*_test.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PTH"]
# 中文全角标点被判「歧义 unicode」，同根 pyproject 的豁免理由
ignore = ["RUF001", "RUF002", "RUF003"]
