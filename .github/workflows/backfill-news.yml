name: Backfill Historical News

# ── 2026-09-29 自 BIAV-SC-CODE 迁入（守密人裁定：采集代码与工作流整体搬到本公开仓）──
# 公开仓 Actions 分钟与存储免费；CODE 仓 2026-09-27 转私有后采集改在本仓跑，CODE 仓不再参与采集。
# 采集代码在本仓 projects/news/；数据仍按 BIAV_SC_DATA_ROOT 写本仓 Record/（另行克隆一份完整数据根）。
# 定时只在仓库变量 COLLECTION_ENABLED=true 后生效，手动触发不受限（切换前验证用）。
# 本仓公开，运行日志任何人可见——勿在步骤里打印凭据。

# T62 P2-3c 已切换（2026-07-19）：**双目标**——Record/Community 归档写 **BIAV-SC-DATA**
# （backfill_platforms 经 community_root() 分仓桥接），news/data 状态仍写 **code 仓**。
# code 仓 checkout 保 ssh-key（推 state 回 code 仓）+ clone data 仓（PAT，推归档）。
on:
  schedule:
    # 每 6 小时（北京 02:20 / 08:20 / 14:20 / 20:20，即 UTC 18:20 / 00:20 / 06:20 / 12:20）。原写每小时，但 GitHub 定时限流下
    # 实际 4–8.5 小时才跑一次，死手开关按 1 小时预期误判沉默；守密人 2026-09-29 裁定对齐实际。
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to backfill (leave empty for all)'
        required: false
        type: string
      pages:
        description: 'Pages to fetch per platform (default 5)'
        required: false
        default: '5'
        type: string

concurrency:
  group: backfill-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: code-repo

jobs:
  backfill:
    if: (github.ref == 'refs/heads/main') && (github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true')
    strategy:
      fail-fast: false
      matrix:
        platform:
          - bilibili
          - appstore
          - steam_review
          - pixiv
          - ruliweb
          - weixin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIAV_SC_DATA_ROOT: ${{ github.workspace }}/data-repo
    steps:
      - name: Check if this platform should run
        id: check
        working-directory: ${{ github.workspace }}
        env:
          INPUT_PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          REQUESTED="$INPUT_PLATFORM"
          CURRENT="${{ matrix.platform }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code repo（sparse 脚本 + state，ssh-key 供回推）
        uses: actions/checkout@v7
        if: steps.check.outputs.skip != 'true'
        with:
          path: code-repo
          sparse-checkout: |
            projects/news
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v6
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Clone BIAV-SC-DATA（PAT，Record 数据根）
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ github.workspace }}
        env:
          DATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_TOKEN:-}" ]; then
            echo "::error::内置 github.token 不可用"; exit 1
          fi
          # 凭据内联进 remote URL，不再依赖 credential.helper store。
          # 2026-08-18 09:48~13:07 之间起，store helper 在 push 时不再返回任何凭据
          # （fatal: could not read Username for 'https://github.com'），而 pull 因
          # DATA 仓公开、匿名可读照常成功——于是所有写 DATA 仓的作业从那一刻起全部
          # 卡在 commit/push，社区归档整整停摆 3 天而无人察觉。同窗口内本仓零代码改动，
          # 变的是 runner 环境（观测到 git 2.54.0 -> 2.55.0）。
          # URL 内联与 git 版本、helper 实现无关；secret 值由 Actions 在日志中遮蔽，
          # 且仅存在于本次运行的临时 .git/config 内。
          git clone "https://x-access-token:${DATA_TOKEN}@github.com/lightproud/BIAV-SC-DATA.git" data-repo

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r projects/news/requirements.txt

      - name: Pull latest backfill state (code repo)
        if: steps.check.outputs.skip != 'true'
        run: git pull --rebase origin main || true

      - name: "Run backfill: ${{ matrix.platform }}"
        if: steps.check.outputs.skip != 'true'
        env:
          INPUT_PAGES: ${{ github.event.inputs.pages || '5' }}
        run: |
          PAGES="$INPUT_PAGES"
          python projects/news/scripts/backfill_platforms.py --platform ${{ matrix.platform }} --pages $PAGES

      - name: Commit state → code repo
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/news/data/
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: backfill ${{ matrix.platform }} state [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying in $((i * 2))s..."
              sleep $((i * 2))
              [ "$i" = "4" ] && { echo "All push attempts failed"; exit 1; }
            done
          fi

      - name: Commit archive → BIAV-SC-DATA
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ github.workspace }}/data-repo
        run: |
          set -euo pipefail
          git config user.name "Erica (BIAV-SC)"
          git config user.email "lightproud@hotmail.com"
          git add Record/Community/
          if git diff --staged --quiet; then
            echo "No archive changes to commit"
            exit 0
          fi
          git commit -m "data: backfill ${{ matrix.platform }} historical data (T62 P2-3c)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "All push attempts failed"
          exit 1
