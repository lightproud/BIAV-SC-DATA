name: "💬 Collect Video Comments"

# ── 2026-09-29 自 BIAV-SC-CODE 迁入（守密人裁定：采集代码与工作流整体搬到本公开仓）──
# 公开仓 Actions 分钟与存储免费；CODE 仓 2026-09-27 转私有后采集改在本仓跑，CODE 仓不再参与采集。
# 采集代码在本仓 projects/news/；数据仍按 BIAV_SC_DATA_ROOT 写本仓 Record/（另行克隆一份完整数据根）。
# 定时只在仓库变量 COLLECTION_ENABLED=true 后生效，手动触发不受限（切换前验证用）。
# 本仓公开，运行日志任何人可见——勿在步骤里打印凭据。

# 独立采集忘却前夜相关 YouTube 视频（含官方 PV）的热门评论，归档到
# Record/Community/youtube_comments/{date}.json，供会话内报告引用。
# 只用 YOUTUBE_API_KEY（Google，免费配额），不碰 Anthropic API、不花钱。
# T62 P2-3c 已切换（2026-07-19）：写 **BIAV-SC-DATA**（collect_video_comments 经
# community_root() 分仓桥接读 youtube 存档 + 写 youtube_comments），提交推 data 仓。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '归档日期标签 YYYY-MM-DD（默认=北京昨日）'
        required: false
        default: ''
  schedule:
    - cron: '5 7 * * *'   # 每日北京时间 15:05（07:05 UTC）自动采

concurrency:
  group: collect-comments
  cancel-in-progress: false

permissions:
  contents: write  # 内置 github.token 推送本仓数据（2026-09-29 起不再用个人令牌）

env:
  BIAV_SC_DATA_ROOT: ${{ github.workspace }}/data-repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.ref == 'refs/heads/main') && (github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true')
    steps:
      - name: Checkout code repo（sparse 脚本，不取数据）
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            projects/news
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 本脚本自身只用 urllib，但为取 dump_json_atomic 而 import news_common，
      # 后者顶层 import requests——缺此步即在 import 期 ModuleNotFoundError。
      # 装声明档而非手挑单包：依赖清单单一真相源，防 news_common 日后再引新包时复发。
      - name: Install dependencies
        run: pip install -r projects/news/requirements.txt

      - name: Clone BIAV-SC-DATA（PAT，数据根：读 youtube 存档 + 写评论）
        env:
          DATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_TOKEN:-}" ]; then
            echo "::error::内置 github.token 不可用"; exit 1
          fi
          # 凭据内联进 remote URL，不再依赖 credential.helper store。
          # 2026-08-18 09:48~13:07 之间起，store helper 在 push 时不再返回任何凭据
          # （fatal: could not read Username for 'https://github.com'），而 pull 因
          # DATA 仓公开、匿名可读照常成功——于是所有写 DATA 仓的作业从那一刻起全部
          # 卡在 commit/push，社区归档整整停摆 3 天而无人察觉。同窗口内本仓零代码改动，
          # 变的是 runner 环境（观测到 git 2.54.0 -> 2.55.0）。
          # URL 内联与 git 版本、helper 实现无关；secret 值由 Actions 在日志中遮蔽，
          # 且仅存在于本次运行的临时 .git/config 内。
          git clone "https://x-access-token:${DATA_TOKEN}@github.com/lightproud/BIAV-SC-DATA.git" data-repo

      - name: Collect video comments
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          D="${{ github.event.inputs.date }}"
          [ -n "$D" ] || D=$(TZ=Asia/Shanghai date -d 'yesterday' +%Y-%m-%d)
          python projects/news/scripts/collect_video_comments.py --date "$D"

      - name: Commit comments archive → BIAV-SC-DATA
        run: |
          set -euo pipefail
          cd data-repo
          git config user.name "Erica (BIAV-SC)"
          git config user.email "lightproud@hotmail.com"
          git add Record/Community/youtube_comments/
          if git diff --staged --quiet; then
            echo "No new comments to commit"
            exit 0
          fi
          git commit -m "data: archive youtube video comments (T62 P2-3c)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main; then
              git push origin main && exit 0
            elif [ -d "$(git rev-parse --git-path rebase-merge)" ] ||
                 [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
              git rebase --abort || exit 1
            fi
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done
          echo "All push attempts failed"
          exit 1
