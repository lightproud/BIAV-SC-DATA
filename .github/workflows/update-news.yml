name: Update Community News

# ── 2026-09-29 自 BIAV-SC-CODE 迁入（守密人裁定：采集代码与工作流整体搬到本公开仓）──
# 公开仓 Actions 分钟与存储免费；CODE 仓 2026-09-27 转私有后采集改在本仓跑，CODE 仓不再参与采集。
# 采集代码在本仓 projects/news/；数据仍按 BIAV_SC_DATA_ROOT 写本仓 Record/（另行克隆一份完整数据根）。
# 定时只在仓库变量 COLLECTION_ENABLED=true 后生效，手动触发不受限（切换前验证用）。
# 本仓公开，运行日志任何人可见——勿在步骤里打印凭据。

# T62 P2-3c 已切换（2026-07-19）：**双目标**——Record/Community 归档写 **BIAV-SC-DATA**
# （archive_platforms / repair_gaps 经 community_root() 分仓桥接），采集跨轮状态
# （projects/news/data/）仍写 **code 仓**。故 code 仓 checkout 保 ssh-key（推 state 回 code
# 仓、绕分支保护）+ clone data 仓（PAT，推 Record/Community）。
#
# 2026-08-21 输出展示层整层删除（守密人裁定）：管线中间产物（news.json / news-raw.json /
# *-latest.json）改落**运行期工作根**（archive_layout.news_run_root()，默认 projects/news/run/，
# gitignore），同一 job 内产生、同一 job 内被归档步吃掉，**不再提交回 code 仓**。回推 code 仓
# 的只剩 projects/news/data/ 下的跨轮状态（source-health / validation-drops / 采集游标）。
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

defaults:
  run:
    working-directory: code-repo

jobs:
  update:
    if: (github.ref == 'refs/heads/main') && (github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIAV_SC_DATA_ROOT: ${{ github.workspace }}/data-repo
    steps:
      - name: Checkout code repo（sparse 脚本 + output/state，ssh-key 供回推）
        uses: actions/checkout@v7
        with:
          path: code-repo
          sparse-checkout: |
            projects/news
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Clone BIAV-SC-DATA（PAT，Record 数据根）
        working-directory: ${{ github.workspace }}
        env:
          DATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_TOKEN:-}" ]; then
            echo "::error::内置 github.token 不可用"; exit 1
          fi
          # 凭据内联进 remote URL，不再依赖 credential.helper store。
          # 2026-08-18 09:48~13:07 之间起，store helper 在 push 时不再返回任何凭据
          # （fatal: could not read Username for 'https://github.com'），而 pull 因
          # DATA 仓公开、匿名可读照常成功——于是所有写 DATA 仓的作业从那一刻起全部
          # 卡在 commit/push，社区归档整整停摆 3 天而无人察觉。同窗口内本仓零代码改动，
          # 变的是 runner 环境（观测到 git 2.54.0 -> 2.55.0）。
          # URL 内联与 git 版本、helper 实现无关；secret 值由 Actions 在日志中遮蔽，
          # 且仅存在于本次运行的临时 .git/config 内。
          git clone "https://x-access-token:${DATA_TOKEN}@github.com/lightproud/BIAV-SC-DATA.git" data-repo

      - name: Install dependencies
        run: pip install -r projects/news/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run collection (single entry)
        id: collect
        continue-on-error: true
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_IDS: ${{ secrets.FACEBOOK_PAGE_IDS }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          TWITTER_HANDLES: ${{ secrets.TWITTER_HANDLES }}
          DC_GALLERY_ID: ${{ secrets.DC_GALLERY_ID }}
          QQ_CHANNEL: ${{ secrets.QQ_CHANNEL }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
          NAVER_COOKIE: ${{ secrets.NAVER_COOKIE }}
        run: python projects/news/scripts/collect_global.py

      - name: Download media (images, covers, fan art)
        run: python projects/news/scripts/download_media.py --max-downloads 100

      - name: Archive platform data by date
        run: python projects/news/scripts/archive_platforms.py

      - name: Repair archive date gaps
        run: python projects/news/scripts/repair_gaps.py

      - name: Refresh silent-source health report
        run: python projects/news/scripts/silent_sources_audit.py --write --check-source-freshness

      - name: Core-source health gate (non-blocking alarm)
        id: health_gate
        continue-on-error: true
        run: python projects/news/scripts/silent_sources_audit.py --strict

      - name: Commit cross-run state → code repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/news/data/
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update news collection state [skip ci]"
            for i in 1 2 3 4; do
              if git pull --rebase origin main; then
                git push origin main && break
              else
                git checkout --theirs . 2>/dev/null || true
                # 同上：冲突解决限定在本作业的产出面，不放大到整棵工作树。
                git add -A projects/news/data/
                git -c core.editor=true rebase --continue \
                  && git push origin main && break
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push attempt $i failed, retrying in ${i}s..."
              sleep $i
              [ "$i" = "4" ] && { echo "All push attempts failed"; exit 1; }
            done
          fi

      - name: Commit archive → BIAV-SC-DATA
        working-directory: ${{ github.workspace }}/data-repo
        run: |
          set -euo pipefail
          git config user.name "Erica (BIAV-SC)"
          git config user.email "lightproud@hotmail.com"
          git add Record/Community/
          if git diff --staged --quiet; then
            echo "No archive changes to commit"
            exit 0
          fi
          git commit -m "data: archive community platform data (T62 P2-3c)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done
          echo "All push attempts failed"
          exit 1

      - name: Surface collection failure (sentinel check)
        run: |
          if [ -f projects/news/collect-failure.flag ]; then
            echo "Collection reported failure:"
            cat projects/news/collect-failure.flag
            exit 1
          fi

      - name: Open health alert issue (deduplicated)
        if: steps.health_gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="[健康门控] 采集健康告警（核心源沉默 或 校验丢弃超阈值）"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" \
              --body "silent_sources_audit --strict 触发告警（核心源零产出/长期沉默，或单源单轮校验丢弃 >= 50 条——后者意味着采集在产出但被校验层扔掉，查 VALID_SOURCES/必填字段契约是否漂移）。具体原因见运行日志 [健康门控] 行。运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}。详见 projects/news/data/source-health.json 与 validation-drops.json。source_date_checks 只核对部分沉默叶的最新公开日期；unverified 表示未核实，no_newer_source_date 不证明采集完整，告警阈值未改变。"
          else
            echo "Alert issue already open, skipping"
          fi

      - name: Surface collector failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo "collect_global=${{ steps.collect.outcome }}"
          exit 1
