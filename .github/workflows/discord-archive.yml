name: Discord Archive

# ── 2026-09-29 自 BIAV-SC-CODE 迁入（守密人裁定：采集代码与工作流整体搬到本公开仓）──
# 公开仓 Actions 分钟与存储免费；CODE 仓 2026-09-27 转私有后采集改在本仓跑，CODE 仓不再参与采集。
# 采集代码在本仓 projects/news/；数据仍按 BIAV_SC_DATA_ROOT 写本仓 Record/（另行克隆一份完整数据根）。
# 定时只在仓库变量 COLLECTION_ENABLED=true 后生效，手动触发不受限（切换前验证用）。
# 本仓公开，运行日志任何人可见——勿在步骤里打印凭据。

# T62 P2-3c 已切换（2026-07-19）：discord 采集写 **BIAV-SC-DATA**（不再写 code 仓）。
# 三个写脚本（discord_archiver / backfill_forum_starters / archive_engine）经 env
# BIAV_SC_DATA_ROOT 解析数据根 = data 仓 checkout；提交推 data 仓（PAT）。
# 月度 cleanup 的 Release 备份仍上传 code 仓 community-data 桶（gh --repo $GITHUB_REPOSITORY，
# 历史备份桶暂留 code 仓）。前置 secret：DISCORD_BOT_TOKEN（写数据用内置 github.token）。

on:
  schedule:
    # 每 3 小时（对齐 jp=45 / volunteer=15 / history-backfill=30，本工作流占 05 分位）。
    # 原为 '0 7 * * *' 一天一轮：global 是三个公会里最大的一个（日均 ~1 万条），
    # 一天一轮 × 每频道 5k 配额 = 日排干上限 5k/频道，而 general-chat 日产 ~7.2k、
    # morimens-game-chat ~7k —— 每天净欠 2k+，游标只会越掉越远。频次 ×8 与归档器
    # 侧的积压追赶轮（Track 1b）是同一个赤字的两半，必须一起上。
    - cron: '5 */3 * * *'
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: incremental (default) / monthly-cleanup / force-month'
        required: false
        default: 'incremental'
      force_month:
        description: 'When mode=force-month: YYYY-MM (comma-separated for multiple).'
        required: false
        default: ''

concurrency:
  # 与 discord-history-backfill 共用同一把锁：两者都 `git add Record/Community/discord/`，
  # 都会改 global 的 state.json / activity_daily / channels——是同一份文件的两个写方。
  # 频次提到每 3 小时、归档器又会吃满 35 分钟预算之后，本作业持有 data 仓 clone 的窗口
  # 从 7~10 分钟涨到 35 分钟以上，正好罩住 backfill 的 `30 */3` 档，rebase 内容冲突
  # 由「偶发」变成「必然」（2026-08-17 run 31992498596 即因此整轮丢弃）。
  # 串行化是治本：跨 clone 并发改同一个 state.json，即便文本能合上，语义也是后写覆盖先写。
  # jp / volunteer 各写自己的子目录（discord/jp、discord/volunteer），与本组无文件重叠，
  # 保持各自独立的锁，不必陪跑。
  group: discord-global-write-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # 月度 / 强制归档传本仓 Release；写数据亦用内置 github.token

jobs:
  archive:
    if: (github.ref == 'refs/heads/main') && (github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    # 55 > 归档器 35 + forum starter 15 + checkout/commit/push 余量。
    # 原为 45，正好等于归档器自己的默认预算：归档器一旦吃满，作业会在 commit 之前
    # 被砍，整轮采集白跑。加了积压追赶轮后归档器确实会吃满，所以这里必须留出空档。
    timeout-minutes: 55
    env:
      BIAV_SC_DATA_ROOT: ${{ github.workspace }}/data-repo
    steps:
      - name: Checkout code repo（sparse 脚本，不取数据）
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            projects/news
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r projects/news/requirements.txt

      - name: Clone BIAV-SC-DATA（PAT，数据根）
        env:
          DATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_TOKEN:-}" ]; then
            echo "::error::内置 github.token 不可用"; exit 1
          fi
          # 凭据内联进 remote URL，不再依赖 credential.helper store。
          # 2026-08-18 09:48~13:07 之间起，store helper 在 push 时不再返回任何凭据
          # （fatal: could not read Username for 'https://github.com'），而 pull 因
          # DATA 仓公开、匿名可读照常成功——于是所有写 DATA 仓的作业从那一刻起全部
          # 卡在 commit/push，社区归档整整停摆 3 天而无人察觉。同窗口内本仓零代码改动，
          # 变的是 runner 环境（观测到 git 2.54.0 -> 2.55.0）。
          # URL 内联与 git 版本、helper 实现无关；secret 值由 Actions 在日志中遮蔽，
          # 且仅存在于本次运行的临时 .git/config 内。
          git clone "https://x-access-token:${DATA_TOKEN}@github.com/lightproud/BIAV-SC-DATA.git" data-repo

      - name: Determine run mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$INPUT_MODE" = "force-month" ]; then
            echo "mode=force" >> $GITHUB_OUTPUT
          elif [ "$EVENT_SCHEDULE" = "0 6 1 * *" ] || [ "$INPUT_MODE" = "monthly-cleanup" ]; then
            echo "mode=monthly" >> $GITHUB_OUTPUT
          else
            echo "mode=incremental" >> $GITHUB_OUTPUT
          fi

      - name: Run Discord archiver (incremental)
        if: steps.mode.outputs.mode == 'incremental'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_RUNTIME_BUDGET: '2100'   # 35 min，给同作业后续步骤留出预算
        run: python projects/news/scripts/discord_archiver.py

      - name: Backfill forum thread starters (catches up legacy gap)
        if: steps.mode.outputs.mode == 'incremental'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # 原为 3600（60 min）——比作业 timeout 本身还长，从来没有兑现过，
          # 实际预算一直是「45 分钟减去归档器用掉的部分」。改成 15 min 说实话。
          RUNTIME_BUDGET: '900'
          RATE_LIMIT_SLEEP: '0.2'
        run: python projects/news/scripts/backfill_forum_starters.py

      - name: Run monthly cleanup (archive old data to Releases)
        if: steps.mode.outputs.mode == 'monthly'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python projects/news/scripts/archive_discord.py

      - name: Run force-month archive (manual stop-bleed)
        if: steps.mode.outputs.mode == 'force'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_MONTH_INPUT: ${{ github.event.inputs.force_month }}
        run: |
          if [ -z "$FORCE_MONTH_INPUT" ]; then
            echo "ERROR: mode=force-month requires force_month input (e.g. 2026-03)"
            exit 1
          fi
          FLAGS=""
          IFS=',' read -ra MONTHS <<< "$FORCE_MONTH_INPUT"
          for m in "${MONTHS[@]}"; do
            m_trimmed="$(echo "$m" | tr -d '[:space:]')"
            [ -n "$m_trimmed" ] && FLAGS="$FLAGS --force-month $m_trimmed"
          done
          echo "Running: python projects/news/scripts/archive_discord.py $FLAGS"
          python projects/news/scripts/archive_discord.py $FLAGS

      - name: Commit and push if changed → BIAV-SC-DATA
        run: |
          set -euo pipefail
          cd data-repo
          git config user.name "Erica (BIAV-SC)"
          git config user.email "lightproud@hotmail.com"
          git add Record/Community/discord/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MSG="data: archive Discord data (T62 P2-3c)"
          if [ "${{ steps.mode.outputs.mode }}" = "monthly" ]; then
            MSG="data: monthly Discord cleanup — old JSONL backed up to Releases"
          elif [ "${{ steps.mode.outputs.mode }}" = "force" ]; then
            MSG="data: force-month Discord cleanup — JSONL backed up to Releases"
          fi
          git commit -m "$MSG"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            # rebase 撞冲突会在树里留下未合并文件。不 abort 就重试，后续每一次
            # pull 都只会回 "Pulling is not possible because you have unmerged
            # files" —— 2026-08-17 run 31992498596 实测：4 次尝试里有 3 次是这条
            # 空转，35 分钟采集成果原样丢弃。abort 让下一次重试回到干净基线，
            # 也让真冲突（内容级、重试也解不开）尽快落到响亮失败而不是被噪声淹没。
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done
          echo "All push attempts failed"
          # 未推上去 = origin 上的游标没有前移，下一轮从同一基线重抓，
          # 只丢本轮工时、不丢数据、不会写坏归档。
          exit 1
